  роли палитры набора, поэтому элемент перекрашивается выбранной палитрой.
  Снято: тени полосы и выбранной ячейки; рост выбранного и наведённого знака 1.25; синие краски; плавность 0.3–0.5 s; белый знак на серой подложке при нажатии (второй источник).
  Приведено к единой форме: полоса — лоток с волоском; пункты — радио: выбор держит браузер, стрелки ходят без скрипта; выбранный — знак краской марки в ячейке с волоском; значки из листа набора: каталог, поиск, избранное, корзина, кабинет — вместо панели, профиля, сообщений, помощи и настроек: панели и шестерёнки в листе нет; вариант второго источника — выбор темы: пилюля с волоском, выбранный — тоном; солнце и луна; имя каждого знака — для чтения вслух.
