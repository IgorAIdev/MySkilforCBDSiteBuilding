<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>36 · Панель с ползунками</title>
<link rel="stylesheet" href="../palettes.css">
<link rel="stylesheet" href="../../styles/scale.css">
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../base.css">
<script src="../stage.js"></script>
<!--
  Элемент 36 — «Панель с ползунками». Источник — CSS от заказчика 24.09.2026 (source.css).
  В сайт не встроен. Всё, кроме атрибутов, — из основы (../base.css); краски —
  роли палитры набора, поэтому элемент перекрашивается выбранной палитрой.
  Снято: стекло с размытием и тени; поворот «закрыть» под рукой; рост ручки под рукой; превью света с градиентом и поля ввода; синий.
  Приведено к единой форме: лист с волоском; выбор — кнопка без заливки со знаком и шевроном, раскрывается (aria-expanded); «Бета» — метка тона; ползунок: дорожка тона, заполнение маркой до ручки, ручка — круг пола с краем; число рядом идёт за ручкой; значки из листа набора.
  Наведение: у кнопок: вуаль 5 %. Нажатие: 9 %, 0.97 и на пиксель ниже.
-->
</head>
<body>
  <div class="live one">
    <div class="card"><div class="row"><button class="el" data-voice="ghost" data-size="sm" aria-expanded="false" type="button"><svg data-sign="sun"></svg>Light<svg class="end" data-sign="chevron-down"></svg></button><span class="tag">Beta</span><button class="el" data-voice="ghost" data-icon data-size="sm" type="button" aria-label="Close"><svg data-sign="x"></svg></button></div><hr><label class="control">Intensity<input class="range" type="range" min="0" max="100" value="60"><output>60</output></label><label class="control">Warmth<input class="range" type="range" min="0" max="100" value="35"><output>35</output></label></div>
  </div>

  <div class="states" aria-hidden="true">
    <figure><div class="card"><div class="row"><span class="el" data-voice="ghost" data-size="sm"><svg data-sign="sun"></svg>Light<svg class="end" data-sign="chevron-down"></svg></span><span class="tag">Beta</span><span class="el" data-voice="ghost" data-icon data-size="sm"><svg data-sign="x"></svg></span></div><hr><label class="control">Intensity<input class="range" type="range" min="0" max="100" value="60"><output>60</output></label><label class="control">Warmth<input class="range" type="range" min="0" max="100" value="35"><output>35</output></label></div><figcaption>покой</figcaption></figure>
    <figure><div class="card"><div class="row"><span class="el" data-voice="ghost" data-size="sm" data-state="hover"><svg data-sign="sun"></svg>Light<svg class="end" data-sign="chevron-down"></svg></span><span class="tag">Beta</span><span class="el" data-voice="ghost" data-icon data-size="sm" data-state="hover"><svg data-sign="x"></svg></span></div><hr><label class="control">Intensity<input class="range" type="range" min="0" max="100" value="60"><output>60</output></label><label class="control">Warmth<input class="range" type="range" min="0" max="100" value="35"><output>35</output></label></div><figcaption>наведение</figcaption></figure>
    <figure><div class="card"><div class="row"><span class="el" data-voice="ghost" data-size="sm" data-state="press"><svg data-sign="sun"></svg>Light<svg class="end" data-sign="chevron-down"></svg></span><span class="tag">Beta</span><span class="el" data-voice="ghost" data-icon data-size="sm" data-state="press"><svg data-sign="x"></svg></span></div><hr><label class="control">Intensity<input class="range" type="range" min="0" max="100" value="60"><output>60</output></label><label class="control">Warmth<input class="range" type="range" min="0" max="100" value="35"><output>35</output></label></div><figcaption>нажатие</figcaption></figure>
    <figure><div class="card"><div class="row"><span class="el" data-voice="ghost" data-size="sm" data-state="focus"><svg data-sign="sun"></svg>Light<svg class="end" data-sign="chevron-down"></svg></span><span class="tag">Beta</span><span class="el" data-voice="ghost" data-icon data-size="sm"><svg data-sign="x"></svg></span></div><hr><label class="control">Intensity<input class="range" type="range" min="0" max="100" value="60"><output>60</output></label><label class="control">Warmth<input class="range" type="range" min="0" max="100" value="35"><output>35</output></label></div><figcaption>фокус</figcaption></figure>
  </div>
</body>
