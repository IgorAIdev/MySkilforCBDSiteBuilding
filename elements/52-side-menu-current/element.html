  Приведено к единой форме: меню — бумага с волоском, пункты — ссылки строкой со знаком; текущий — тон и черта марки у начала строки; значки из листа набора: заказы, избранное, адреса, профиль; фокус — кольцо.
  Наведение: строка: подложка 5 %. Нажатие: 9 %, 0.97 и на пиксель ниже.
-->
