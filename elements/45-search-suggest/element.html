<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>45 · Поиск с подсказками</title>
<link rel="stylesheet" href="../palettes.css">
<link rel="stylesheet" href="../../styles/scale.css">
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../base.css">
<script src="../stage.js"></script>
<!--
  Элемент 45 — «Поиск с подсказками». Источник — разметка Tailwind от заказчика 24.09.2026, переслана из сессии «Кнопки и дизайн» (source.html).
  В сайт не встроен. Всё, кроме атрибутов, — из основы (../base.css); краски —
  роли палитры набора, поэтому элемент перекрашивается выбранной палитрой.
  Снято: появление с опусканием — меню встаёт на место, а не едет; зелёное кольцо фокуса и зелёная подложка строки; тень меню; значки даты и просмотров — в листе набора их нет; у товара вместо даты и просмотров — цена; z-index 500 — слой решает сайт (запрет 8); обрезка заголовка в две строки.
  Приведено к единой форме: поле тоном набора с лупой, как 41; меню — бумага всплывающего с волоском; на сайте — popover (запрет 8); имена разделов — заглавными с разрядкой, краской подписи; последние запросы — строки меню без фона; товар — строка со знаком в плитке, именем и ценой; фокус поля — кольцо набора.
  Наведение: поле: тон + 5 % чернил; строка меню: подложка 5 %. Нажатие: строка меню: 9 %, 0.97 и на пиксель ниже.
-->
</head>
<body>
  <div class="live one">
    <div class="find"><label class="field"><svg data-sign="search"></svg><input type="search" placeholder="Search products" aria-label="Search products"></label><div class="menu"><p class="label">Last searches</p><button class="el" data-voice="ghost" data-row data-size="sm" type="button">Hemp oil 10 %</button><button class="el" data-voice="ghost" data-row data-size="sm" type="button">CBD balm</button><p class="label">Products</p><button class="el" data-voice="ghost" data-row data-size="xl" type="button"><span class="mark" data-shape="tile"><svg data-sign="package"></svg></span><span class="lines">Hemp oil 10 %, 30 ml<small>29,90 €</small></span></button></div></div>
  </div>

  <div class="states" aria-hidden="true">
    <figure><div class="find"><span class="field"><svg data-sign="search"></svg><input type="search" placeholder="Search products" tabindex="-1" readonly></span></div><figcaption>покой</figcaption></figure>
    <figure><div class="find"><span class="field" data-state="hover"><svg data-sign="search"></svg><input type="search" placeholder="Search products" tabindex="-1" readonly></span></div><figcaption>наведение</figcaption></figure>
    <figure><div class="find" data-open><span class="field" data-state="focus"><svg data-sign="search"></svg><input type="search" placeholder="Search products" tabindex="-1" readonly></span><div class="menu"><p class="label">Last searches</p><span class="el" data-voice="ghost" data-row data-size="sm">Hemp oil 10 %</span><span class="el" data-voice="ghost" data-row data-size="sm">CBD balm</span><p class="label">Products</p><span class="el" data-voice="ghost" data-row data-size="xl"><span class="mark" data-shape="tile"><svg data-sign="package"></svg></span><span class="lines">Hemp oil 10 %, 30 ml<small>29,90 €</small></span></span></div></div><figcaption>фокус — открыто</figcaption></figure>
    <figure><div class="find" data-open><span class="field" data-state="focus"><svg data-sign="search"></svg><input type="search" placeholder="Search products" tabindex="-1" readonly></span><div class="menu"><p class="label">Last searches</p><span class="el" data-voice="ghost" data-row data-size="sm" data-state="press">Hemp oil 10 %</span><span class="el" data-voice="ghost" data-row data-size="sm">CBD balm</span><p class="label">Products</p><span class="el" data-voice="ghost" data-row data-size="xl"><span class="mark" data-shape="tile"><svg data-sign="package"></svg></span><span class="lines">Hemp oil 10 %, 30 ml<small>29,90 €</small></span></span></div></div><figcaption>нажатие строки</figcaption></figure>
  </div>
</body>
</html>
