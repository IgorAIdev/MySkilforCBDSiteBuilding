  роли палитры набора, поэтому элемент перекрашивается выбранной палитрой.

  Приведено к единой форме: лист пола со скруглённым верхом; пункты во всю ширину: знак над словом, невыбранные — краской подписи; выбранный — чернилами и полужирным; закладка чернил с вырезом «ласточкин хвост» висит с кромки над ним; пункты — радио: выбор держит браузер, стрелки ходят без скрипта; значки из листа набора: магазин (лист), корзина, предложения (звезда), избранное, кабинет — дома и знака скидки в листе нет.
