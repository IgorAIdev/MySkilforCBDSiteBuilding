  В сайт не встроен. Всё, кроме атрибутов, — из основы (../base.css); краски —
  роли палитры набора, поэтому элемент перекрашивается выбранной палитрой.
  Снято: полупрозрачный фон с размытием и тени; белая рамка 3 px и бегущий блик кнопки; рост кнопки 1.05 и сдвиг значка под рукой; z-index 1000 — место в слое решает сайт (запрет 8); подчёркивание имени товара только под рукой; проценты ширины колонок.
  Приведено к единой форме: лист с волоском; знак корзины из листа набора в круге тона; сжатая карточка всплывающего: заголовок и цена ростом тела; имя товара — ссылка, подчёркнута всегда (И289); цена — рядом с кнопкой; кнопка — чернила пилюлей со стрелкой, рост 32; «закрыть» — кнопка-знак набора.
  Наведение: кнопка: чернила + 5 % краски надписи; «закрыть» — подложка 5 %. Нажатие: + 9 %, 0.97 и на пиксель ниже.
-->
