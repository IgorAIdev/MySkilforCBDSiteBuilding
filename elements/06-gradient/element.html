<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 · Градиент марки</title>
<link rel="stylesheet" href="../palettes.css">
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../base.css">
<script src="../stage.js"></script>
<!--
  Элемент 06 — «Градиент марки». Источник — CSS от заказчика 24.09.2026 (source.css).
  В сайт не встроен. Всё, кроме атрибутов, — из основы (../base.css); краски —
  роли палитры набора, поэтому элемент перекрашивается выбранной палитрой.
  Снято: пульсирующее кольцо под рукой; сдвиг градиента при наведении.
  Приведено к единой форме: градиент из палитры: от нажатой краски марки к обычной, вместо синего к голубому — на голубом конце белая надпись не читалась; пилюля вместо угла 20.
  Наведение: поверх градиента 5 % краски надписи. Нажатие: 9 %, кнопка 0.97 и на пиксель ниже.
-->
</head>
<body>
  <div class="live one">
    <button class="el" data-voice="loud" data-fill="gradient" data-shape="pill" type="button">Discover</button>
  </div>

  <div class="states" aria-hidden="true">
    <figure><span class="el" data-voice="loud" data-fill="gradient" data-shape="pill">Discover</span><figcaption>покой</figcaption></figure>
    <figure><span class="el" data-voice="loud" data-fill="gradient" data-shape="pill" data-state="hover">Discover</span><figcaption>наведение</figcaption></figure>
    <figure><span class="el" data-voice="loud" data-fill="gradient" data-shape="pill" data-state="press">Discover</span><figcaption>нажатие</figcaption></figure>
    <figure><span class="el" data-voice="loud" data-fill="gradient" data-shape="pill" data-state="focus">Discover</span><figcaption>фокус</figcaption></figure>
  </div>
</body>
</html>
