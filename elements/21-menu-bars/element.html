<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21 · Полоски меню → крест</title>
<link rel="stylesheet" href="../palettes.css">
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../base.css">
<script src="../stage.js"></script>
<!--
  Элемент 21 — «Полоски меню → крест». Источник — четыре CSS от заказчика 24.09.2026: полоски разной длины, дважды — равной, и по центру (source.css, source-2.css, source-3.css, source-4.css).
  В сайт не встроен. Всё, кроме атрибутов, — из основы (../base.css); краски —
  роли палитры набора, поэтому элемент перекрашивается выбранной палитрой.
  Снято: поворот всей кнопки на 180°; движение в два шага: сначала к середине, потом поворот; синяя и чёрная краска полосок.
  Приведено к единой форме: полоски — толщиной штриха значков, краской надписи; раскрытие за 280 мс, как у набора; полоски разной длины и равной — одним элементом: источники совпали после разбора; полоски по центру (80 / 100 / 80 %) — к варианту равных: складываются так же.
  Наведение: подложка 5 % чернил. Нажатие: подложка 9 %, кнопка 0.97 и на пиксель ниже.
-->
</head>
<body>
  <div class="live one">
    <div class="group"><button class="el" data-voice="ghost" data-shape="pill" data-icon aria-expanded="false" type="button" aria-label="Меню"><span class="bars"><i></i><i></i><i></i></span></button><button class="el" data-voice="ghost" data-shape="pill" data-icon data-bars="even" aria-expanded="false" type="button" aria-label="Меню"><span class="bars"><i></i><i></i><i></i></span></button></div>
  </div>

  <div class="states" aria-hidden="true">
    <figure><span class="el" data-voice="ghost" data-shape="pill" data-icon><span class="bars"><i></i><i></i><i></i></span></span><figcaption>покой</figcaption></figure>
    <figure><span class="el" data-voice="ghost" data-shape="pill" data-icon data-state="hover"><span class="bars"><i></i><i></i><i></i></span></span><figcaption>наведение</figcaption></figure>
    <figure><span class="el" data-voice="ghost" data-shape="pill" data-icon data-state="press"><span class="bars"><i></i><i></i><i></i></span></span><figcaption>нажатие</figcaption></figure>
    <figure><span class="el" data-voice="ghost" data-shape="pill" data-icon data-state="focus"><span class="bars"><i></i><i></i><i></i></span></span><figcaption>фокус</figcaption></figure>
    <figure><span class="el" data-voice="ghost" data-shape="pill" data-icon data-open><span class="bars"><i></i><i></i><i></i></span></span><figcaption>открыто</figcaption></figure>
  </div>
</body>
</html>
