  В сайт не встроен. Всё, кроме атрибутов, — из основы (../base.css); краски —
  роли палитры набора, поэтому элемент перекрашивается выбранной палитрой.
  Снято: бирюзовый знак выбранного вида — краска марки палитры; доллар и слова вариантов — данные магазина.
  Приведено к единой форме: полоса над полкой: вид слева, сортировка справа, волосок под ней; вид полки — сегменты в подложке тона знаками «списком» и «сеткой»; выбранный — плашка пола и знак краской марки; сортировка — кнопка контуром: знак сортировки, «Sort by:» краской подписи, выбранное чернилами; раскрывает меню вариантов под собой (на сайте — popover, запрет 8), у выбранного — галка маркой; знаки «списком», «сеткой» и «сортировка» добавлены в лист набора из Lucide; варианты сортировки и их слова — данные магазина.
  Наведение: кнопка: кромка встаёт в голос марки; вид — подложка 5 %. Нажатие: + 9 %, 0.97 и на пиксель ниже.
-->
