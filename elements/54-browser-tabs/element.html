<!--
  Элемент 54 — «Вкладки-листы как в браузере». Источник — CSS от заказчика 24.09.2026 (макет окна браузера), переслан из сессии «Кнопки и дизайн»; поле сообщения из того же источника — 55 (source.css).
  В сайт не встроен. Всё, кроме атрибутов, — из основы (../base.css); краски —
  роли палитры набора, поэтому элемент перекрашивается выбранной палитрой.
  Снято: окно браузера вокруг — обёртка показа: строка адреса, кнопка новой вкладки, серые рамки; адрес, выезжающий из-под вкладки, — адрес стоит в панели; плавность 200 ms.
  Приведено к единой форме: полоса вкладок — тон, у вкладок скруглён только верх; выбранная — пол страницы и сливается с панелью под ней; панель показывает своё у каждой вкладки; значки из листа набора вместо значков сайтов; пункты — радио, фокус — кольцо у вкладки.
  Наведение: подложка 5 % чернил. Нажатие: 9 %, 0.97 и на пиксель ниже.
-->
