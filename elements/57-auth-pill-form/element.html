<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>57 · Форма-пилюли: регистрация и вход</title>
<link rel="stylesheet" href="../palettes.css">
<link rel="stylesheet" href="../../styles/scale.css">
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../base.css">
<script src="../stage.js"></script>
<!--
  Элемент 57 — «Форма-пилюли: регистрация и вход». Источник — два CSS от заказчика 24.09.2026, пара из одного набора: регистрация и вход; переслан из сессии «Кнопки и дизайн» (source.css, source-2.css).
  В сайт не встроен. Всё, кроме атрибутов, — из основы (../base.css); краски —
  роли палитры набора, поэтому элемент перекрашивается выбранной палитрой.
  Снято: тени листа и кнопок, «вдавливание» тенью при нажатии; бирюзовая марка — краска марки палитры; шрифт Lucida Sans — шрифт решает сайт; подписи 9 px и ссылки 10–11 px — роль сноски; рамка 2 px у кнопок Apple и Google; высота листа 500 и 550 px — лист по содержимому; знаки Apple и Google: чужие марки ставятся по их правилам при встраивании, в листе набора их нет.
  Приведено к единой форме: лист карточки, заголовок по центру ролью h3; поля — пилюли контуром с подписью над ними; главная — пилюля марки во всю ширину; «через Apple» — чернила, «через Google» — контур; строка «уже есть учётная запись? войти» — сноской по центру, ссылка краской марки и подчёркнута всегда (И289); у входа — «забыли пароль?» ссылкой у конца под полем пароля; выключенная главная — прозрачность --state-off.
  Наведение: кнопки: + 5 % краски надписи; «через Google» встаёт в голос марки. Нажатие: + 9 %, 0.97 и на пиксель ниже.
-->
</head>
<body>
  <div class="live one">
    <div class="column"><form class="card" data-form action="#"><div class="stack" data-align="center"><p class="title">Create an account</p></div><div class="entry"><label class="label" for="up-name">Name</label><label class="field" data-voice="line" data-shape="pill"><input type="text" placeholder="Anna Popescu" id="up-name" autocomplete="name"></label></div><div class="entry"><label class="label" for="up-email">Email</label><label class="field" data-voice="line" data-shape="pill"><input type="email" placeholder="name@example.com" id="up-email" autocomplete="email"></label></div><div class="entry"><label class="label" for="up-pass">Password</label><label class="field" data-voice="line" data-shape="pill"><input type="password" placeholder="At least 8 characters" id="up-pass" autocomplete="new-password"></label></div><button class="el" data-voice="loud" data-shape="pill" type="button">Sign up</button><p class="text" data-align="center">Already have an account? <a href="#">Sign in</a></p><button class="el" data-voice="ink" data-shape="pill" type="button">Continue with Apple</button><button class="el" data-voice="line" data-shape="pill" type="button">Continue with Google</button></form><form class="card" data-form action="#"><div class="stack" data-align="center"><p class="title">Welcome back</p></div><div class="entry"><label class="label" for="in-email">Email</label><label class="field" data-voice="line" data-shape="pill"><input type="email" placeholder="name@example.com" id="in-email" autocomplete="email"></label></div><div class="entry"><label class="label" for="in-pass">Password</label><label class="field" data-voice="line" data-shape="pill"><input type="password" placeholder="Your password" id="in-pass" autocomplete="current-password"></label><p class="hint" data-align="end"><a href="#">Forgot password?</a></p></div><button class="el" data-voice="loud" data-shape="pill" type="button">Sign in</button><p class="text" data-align="center">No account yet? <a href="#">Sign up</a></p><button class="el" data-voice="ink" data-shape="pill" type="button">Continue with Apple</button><button class="el" data-voice="line" data-shape="pill" type="button">Continue with Google</button></form></div>
  </div>

  <div class="states" aria-hidden="true">
    <figure><div class="card" data-form><span class="el" data-voice="loud" data-shape="pill">Sign in</span><span class="el" data-voice="ink" data-shape="pill">Continue with Apple</span><span class="el" data-voice="line" data-shape="pill">Continue with Google</span></div><figcaption>покой</figcaption></figure>
    <figure><div class="card" data-form><span class="el" data-voice="loud" data-shape="pill" data-state="hover">Sign in</span><span class="el" data-voice="ink" data-shape="pill" data-state="hover">Continue with Apple</span><span class="el" data-voice="line" data-shape="pill" data-state="hover">Continue with Google</span></div><figcaption>наведение</figcaption></figure>
    <figure><div class="card" data-form><span class="el" data-voice="loud" data-shape="pill" data-state="press">Sign in</span><span class="el" data-voice="ink" data-shape="pill" data-state="press">Continue with Apple</span><span class="el" data-voice="line" data-shape="pill" data-state="press">Continue with Google</span></div><figcaption>нажатие</figcaption></figure>
    <figure><div class="card" data-form><span class="el" data-voice="loud" data-shape="pill" data-state="focus">Sign in</span><span class="el" data-voice="ink" data-shape="pill">Continue with Apple</span><span class="el" data-voice="line" data-shape="pill">Continue with Google</span></div><figcaption>фокус</figcaption></figure>
    <figure><div class="card" data-form><span class="el" data-voice="loud" data-shape="pill" data-state="off" aria-disabled="true">Sign in</span><span class="el" data-voice="ink" data-shape="pill">Continue with Apple</span><span class="el" data-voice="line" data-shape="pill">Continue with Google</span></div><figcaption>выключено</figcaption></figure>
  </div>
</body>
</html>
