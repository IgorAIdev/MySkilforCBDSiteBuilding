<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 · Explore со стрелкой</title>
<link rel="stylesheet" href="../base.css">
<!--
  Элемент 02 — кнопка со словом и стрелкой в кружке. Источник — код
  Tailwind (source.html рядом). В сайт не встроен. Всё, кроме атрибутов, —
  из основы (../base.css).

  Разобрано до базовой (слово заказчика 24.09.2026): снята заливка фоном при
  наведении, белая надпись при ней, большая тень, размытие, рамка цвета
  заливки; кружок остаётся всегда. Приведено к единой форме: рост 40, тон
  8 % чернил, стрелка — из листа набора, кружок .75 высоты у конца пилюли.
  Движение источника сохранено: стрелка смотрит вверх-вправо и под рукой
  встаёт вправо.
-->
</head>
<body>
  <script src="../icons.js"></script>

  <div class="live one">
    <button class="el" data-shape="pill" data-motion="turn" type="button">Explore<span class="ring"><svg aria-hidden="true"><use href="#arrow-right"/></svg></span></button>
  </div>

  <div class="states" aria-hidden="true">
    <figure><span class="el" data-shape="pill" data-motion="turn">Explore<span class="ring"><svg><use href="#arrow-right"/></svg></span></span><figcaption>покой</figcaption></figure>
    <figure><span class="el" data-shape="pill" data-motion="turn" data-state="hover">Explore<span class="ring"><svg><use href="#arrow-right"/></svg></span></span><figcaption>наведение</figcaption></figure>
    <figure><span class="el" data-shape="pill" data-motion="turn" data-state="press">Explore<span class="ring"><svg><use href="#arrow-right"/></svg></span></span><figcaption>нажатие</figcaption></figure>
    <figure><span class="el" data-shape="pill" data-motion="turn" data-state="focus">Explore<span class="ring"><svg><use href="#arrow-right"/></svg></span></span><figcaption>фокус</figcaption></figure>
  </div>
</body>
</html>
