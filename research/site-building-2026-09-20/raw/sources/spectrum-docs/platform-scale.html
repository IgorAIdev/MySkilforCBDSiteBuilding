"],\"\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L16\",null,{\"data\":{\"id\":\"d1912325-1fa9-4832-ac72-f92d70c3c3b4\",\"title\":\"Platform scale\",\"slug\":\"platform-scale\",\"site\":\"internal and public\",\"release_status\":\"released\",\"search_category\":\"foundation\",\"search_tags\":[\"scale\",\"mobile-scale\",\"desktop-scale\",\"sizing\",\"layout\"],\"show_issues\":false,\"description\":\"Spectrum is designed for multiple platforms. There are two different scales for user interfaces in order to accommodate cursor and touch experiences: a desktop scale and a mobile scale.\",\"hero_image_style\":\"standard\",\"table_of_contents\":true,\"component\":false,\"all_interactive_states\":\"not-applicable\",\"all_color_themes\":\"not-applicable\",\"all_platform_scales\":\"not-applicable\",\"defined_behaviors\":\"not-applicable\",\"usage_guidelines\":\"not-applicable\",\"internationalization_guidelines\":\"not-applicable\",\"keyboard_interactions\":\"not-applicable\",\"design_tokens\":\"not-applicable\",\"generated_ui_kit\":\"not-applicable\",\"isdeprecated\":false,\"defined_options\":\"not-applicable\",\"accessible_contrast_text\":\"not-applicable\",\"accessible_contrast_ui_components\":\"not-applicable\",\"accessible_use_color\":\"not-applicable\",\"ui_kit\":\"not-applicable\",\"writing_guidelines\":\"not-applicable\",\"content_design\":\"not-applicable\",\"xd_plugin\":\"not-applicable\",\"spectrum_design\":\"yes\",\"spectrum_dna\":\"no\",\"spectrum_css\":\"no\",\"react_spectrum_v2\":\"no\",\"react_spectrum_v3\":\"no\",\"spectrum_web_components\":\"no\",\"spectrum_windows\":\"no\",\"spectrum_macos\":\"no\",\"spectrum_ios\":\"no\",\"spectrum_android\":\"no\",\"drover_v7\":\"no\",\"spectrum_uxp\":\"no\",\"patterns_figma_url\":null,\"patterns_generic_link_text\":null,\"patterns_generic_link_url\":null,\"hero_image_desktop\":{\"width\":1952,\"id\":\"5b24f3e5-046c-4f12-9f2a-74b604397b3b\",\"filename_download\":\"platform-scale_hero_desktop@2x.png\",\"height\":440,\"description\":\"[blank]\",\"modified_on\":\"2022-04-11T20:30:02.989Z\",\"folder\":null},\"hero_image_mobile\":{\"width\":1952,\"id\":\"f3010745-25a9-431a-9661-6dec83b33165\",\"filename_download\":\"platform-scale_hero_mobile@2x.png\",\"height\":440,\"description\":\"[blank]\",\"modified_on\":\"2022-04-11T20:30:03.015Z\",\"folder\":null},\"header_components\":[],\"sections\":[{\"id\":21887,\"sort\":0,\"section\":{\"id\":\"435a15ce-492a-4dd9-bc9c-b366d7307e73\",\"title\":\"Principles\",\"text\":\"Designing for different scales requires finding a balance between platform best practices and design system consistency. Here are the ways to ensure that properties can accommodate to different environments while still sharing a common design language.\",\"visibility\":\"all\",\"display_title\":true,\"content\":[{\"id\":41123,\"sort\":0,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"9d97d527-d6d0-43dc-b7f9-be9469eabe8e\",\"title\":\"Proportions\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Mobile components are larger than their desktop counterparts. Spectrum uses a 1:1.25 scale ratio. This means that a mobile component is 25% larger than its desktop counterpart, and a desktop component is 20% smaller than its mobile counterpart.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"57549468-4b59-441c-b656-54e9a7016617\",\"filename_download\":\"platform-scale_principles_proportions@2x.png\",\"height\":628,\"description\":\"[blank]\",\"modified_on\":\"2022-04-11T20:31:06.441Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":41124,\"sort\":1,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"b1568574-8844-4b4e-8e46-2b736d702c6d\",\"title\":\"Borders\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"While the proportions of a component change between desktop and mobile scales, the border width remains the same at all times.\\n\\n[Learn more at the Object styles page](/page/object-styles#Border-width)\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"6557726e-81e1-44ec-975e-b1787cf94212\",\"filename_download\":\"platform-scale_principles_borders@2x.png\",\"height\":550,\"description\":\"[blank]\",\"modified_on\":\"2022-04-11T20:31:06.513Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":41125,\"sort\":2,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"a092b4a5-2270-468a-89c1-aae142d7c196\",\"title\":\"Typography\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Spectrum defines two sets of font sizes, one for desktop and one for mobile. Text is shown larger in the mobile scale than in the desktop scale.\\n\\n[Learn more at the Typography page](/page/typography#font-sizes)\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"2bf84370-2ac9-41ed-9014-ccdb2c653186\",\"filename_download\":\"platform-scale_principles_typography@2x.png\",\"height\":504,\"description\":\"[blank]\",\"modified_on\":\"2022-04-11T20:31:06.571Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":41126,\"sort\":3,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"6939ac92-a66b-4d26-a4fe-30db46e5d024\",\"title\":\"Iconography\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Spectrum provides two sets of icons, one for desktop and one for mobile, so that the same icon doesn’t need to be manually scaled. Icons appear larger on platforms that have touch experiences than on cursor experiences. Each set contains icons of different sizes such as small, medium, and large.\\n\\n[Learn more at the Iconography page](/page/iconography)\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"90c84aab-2d84-4437-b76e-244b84ebe636\",\"filename_download\":\"platform-scale_principles_iconography@2x.png\",\"height\":500,\"description\":\"[blank]\",\"modified_on\":\"2022-04-11T20:31:06.634Z\",\"folder\":null},\"mobile_image\":null}}]}},{\"id\":21888,\"sort\":1,\"section\":{\"id\":\"f1a18cb4-f70e-4374-9504-8b53d2c47404\",\"title\":\" Choosing the correct scale\",\"text\":null,\"visibility\":\"all\",\"display_title\":true,\"content\":[{\"id\":41127,\"sort\":0,\"collection\":\"double_text\",\"item\":{\"id\":\"e8f6d00c-6f7a-4f06-a4f7-222f43b40ffb\",\"show_headers_on_website\":true,\"text_one\":\"Each platform and context require the use of an appropriate scale. Desktop platforms, like macOS, use the desktop scale. Mobile platforms, like iOS and Android, use the mobile scale. Other platforms that may blur the line between desktop and mobile experiences, such as a device with a touch-enabled desktop screen, should accommodate both scales. For example, UWP (Windows) should display the correct scale depending on the device, and web browsers should display the correct scale based on the width of the browser window.\",\"text_two\":\"\\n| Platform / Context     | Scale     |\\n| ---------- | ---------- |\\n| Web desktop (width \u003e 768 px)       | Desktop       |\\n| Web mobile (width \u003c= 768 px)       | Mobile       |\\n| UWP desktop (Windows)       | Desktop       |\\n| UWP mobile (Windows)       | Mobile       |\\n| macOS       | Desktop       |\\n| iOS       | Mobile       |\\n| Android       | Mobile       |\\n\\n\",\"title_one\":\"Scale by platform\",\"title_two\":null}}]}},{\"id\":21889,\"sort\":2,\"section\":{\"id\":\"7d55a6ce-b99f-453d-a212-3b332b3be293\",\"title\":\"Areas and interactions\",\"text\":\"Desktop and mobile scales are both designed to handle cursor and touch interactions, but the primary interaction for the desktop scale is cursor-based while the primary interaction for the mobile scale is touch-based. Each component includes a set of areas: a placement area for layout purposes, one or more cursor hit areas for cursor interactions, and one or more touch hit areas for touch interactions. Components have only one placement area, but can have multiple hit areas as needed.\",\"visibility\":\"all\",\"display_title\":true,\"content\":[{\"id\":41128,\"sort\":0,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"ac89aec3-31d5-434d-9f66-ff655087d7b3\",\"title\":\"Placement areas\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Placement areas represent the boundaries of a component. These should be used to create layouts and build user interfaces.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"e7b418a7-8fa9-4e93-a8dd-c462bf68133d\",\"filename_download\":\"platform-scale_areas_placement@2x.png\",\"height\":614,\"description\":\"Image highlighting the invisible placement areas which in some cases extends beyond the actual size of the component in both desktop and mobile scale.\",\"modified_on\":\"2022-04-11T20:32:10.975Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":41129,\"sort\":1,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"b3aa86c7-e334-46e9-bcac-156d5d2d0061\",\"title\":\"Cursor hit areas\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Cursor hit area placements and sizes vary for each component. They can be identical to the placement area (e.g., button) or adjusted to a specific portion of a component (e.g., the field of a text field; the handle of a slider).\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"fcb85b14-124e-493e-bce6-d379f22f69ef\",\"filename_download\":\"platform-scale_areas_cursor@2x.png\",\"height\":614,\"description\":\"Image highlighting the invisible cursor hit areas which fills the bounding box of a component, but extends around smaller components that do not have a bounding box, like a checkbox, in both desktop and mobile scale.\",\"modified_on\":\"2022-04-11T20:32:11.051Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":41130,\"sort\":2,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"1c1e060a-0286-4a9c-b9ef-8749e5cd1fbb\",\"title\":\"Touch hit areas\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Touch hit areas placements and sizes vary for each component. They try to respect a minimum width and height of 48 px whenever possible to ensure ease when trying to tap or hold.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"c062d687-0897-4b41-b590-aed4b51844ea\",\"filename_download\":\"platform-scale_areas_touch@2x.png\",\"height\":638,\"description\":\"Image highlighting the invisible touch hit areas which extends beyond the bounding box of most components in both desktop and mobile scale.\",\"modified_on\":\"2022-04-11T20:32:11.122Z\",\"folder\":null},\"mobile_image\":null}}]}}],\"options\":[],\"versions\":[]}}]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"1\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"2\",{\"children\":\"Platform scale - Spectrum\"}],[\"$\",\"meta\",\"3\",{\"name\":\"description\",\"content\":\"Spectrum is designed for multiple platforms. There are two different scales for user interfaces in order to accommodate cursor and touch experiences: a desktop scale and a mobile scale.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"Platform scale - Spectrum\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"Spectrum is designed for multiple platforms. There are two different scales for user interfaces in ord
