ues help to create consistent interfaces by clearly defining relationships between components.\",\"hero_image_style\":\"standard\",\"table_of_contents\":true,\"component\":true,\"all_interactive_states\":\"not-applicable\",\"all_color_themes\":\"not-applicable\",\"all_platform_scales\":\"yes\",\"defined_behaviors\":\"not-applicable\",\"usage_guidelines\":\"yes\",\"internationalization_guidelines\":\"not-applicable\",\"keyboard_interactions\":\"not-applicable\",\"design_tokens\":\"yes\",\"generated_ui_kit\":\"not-applicable\",\"isdeprecated\":false,\"defined_options\":\"not-applicable\",\"accessible_contrast_text\":\"not-applicable\",\"accessible_contrast_ui_components\":\"not-applicable\",\"accessible_use_color\":\"not-applicable\",\"ui_kit\":\"yes\",\"writing_guidelines\":\"not-applicable\",\"content_design\":\"yes\",\"xd_plugin\":\"not-applicable\",\"spectrum_design\":\"yes\",\"spectrum_dna\":\"no\",\"spectrum_css\":\"no\",\"react_spectrum_v2\":\"no\",\"react_spectrum_v3\":\"no\",\"spectrum_web_components\":\"no\",\"spectrum_windows\":\"no\",\"spectrum_macos\":\"no\",\"spectrum_ios\":\"no\",\"spectrum_android\":\"no\",\"drover_v7\":\"no\",\"spectrum_uxp\":\"no\",\"patterns_figma_url\":null,\"patterns_generic_link_text\":null,\"patterns_generic_link_url\":null,\"hero_image_desktop\":null,\"hero_image_mobile\":null,\"header_components\":[],\"sections\":[{\"id\":23585,\"sort\":0,\"section\":{\"id\":\"f79bc25d-c88d-4688-ad14-4e4b488775a2\",\"title\":\"Spacing values\",\"text\":\"Spacing values are static and don’t change based on [platform scale](/page/platform-scale/). Different spacing values can be used for different sizes and scales as needed.\\n\\n\\n| Design token name    | Value     |\\n| ---------- | ---------- |\\n| spacing-50       | 2 px       |\\n| spacing-75       | 4 px       |\\n| spacing-100       | 8 px       |\\n| spacing-200       | 12 px       |\\n| spacing-300       | 16 px       |\\n| spacing-400       | 24 px       |\\n| spacing-500       | 32 px       |\\n| spacing-600       | 40 px       |\\n| spacing-700       | 48 px       |\\n| spacing-800       | 64 px       |\\n| spacing-900       | 80 px       |\\n| spacing-1000       | 96 px       |\\n\\n\",\"visibility\":\"all\",\"display_title\":true,\"content\":[]}},{\"id\":23586,\"sort\":1,\"section\":{\"id\":\"6767fae6-912e-4c87-b985-f82b914e50a4\",\"title\":\"Usage guidelines\",\"text\":null,\"visibility\":\"all\",\"display_title\":true,\"content\":[{\"id\":44916,\"sort\":0,\"collection\":\"usage_guideline\",\"item\":{\"id\":\"3c916aad-99d8-4d86-b924-a2d22c71ae7a\",\"title\":\"Use spacing between components\",\"text\":\"Spacing should be used to define the space between components. \\n\\nKeep in mind that spacing values don’t apply to the padding within a component. For example, the padding between the top of a button and a label doesn’t use a spacing value.\",\"description_do\":null,\"description_dont\":null,\"background_color_do\":null,\"background_color_dont\":null,\"image_do\":{\"width\":688,\"id\":\"9b6ec3d5-5694-4092-af5f-f100467c8cfb\",\"filename_download\":\"spacing_usage-guidelines_between-components@2x.png\",\"height\":528,\"description\":\"Key example showing correct usage of spacing between two text fields and a button. First text field, label Email address. Second text field, label Password. Button, label Sign in. Spacing between text fields, value spacing-200. Spacing between the second text field and button, value spacing-400.\",\"modified_on\":\"2022-03-16T19:01:11.709Z\",\"folder\":null},\"image_dont\":null}},{\"id\":44917,\"sort\":1,\"collection\":\"usage_guideline\",\"item\":{\"id\":\"592b1766-d9fa-4cab-9d4f-da83ce0dca06\",\"title\":\"Use spacing with responsive grids\",\"text\":\"Spacing is useful for individual elements that don’t need to adapt responsively to various viewport sizes. [Responsive grids](/page/responsive-grid) should still be used to design overall layouts.\",\"description_do\":null,\"description_dont\":null,\"background_c
