loadingStyles\":\"$undefined\",\"loadingScripts\":\"$undefined\",\"hasLoading\":false,\"error\":\"$d\",\"errorStyles\":[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/b4360cf725cbfd2e.css\",\"precedence\":\"next\",\"crossOrigin\":\"\"}]],\"errorScripts\":[],\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\",\"styles\":null}]]},[null,[\"$\",\"html\",null,{\"lang\":\"en\",\"children\":[\"$\",\"body\",null,{\"children\":[[\"$\",\"noscript\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"We're sorry but Spectrum documentation site doesn't work without JavaScript enabled. Please enable it to continue.\"}]}],[\"$\",\"$Le\",null,{\"children\":[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\"],\"loading\":\"$undefined\",\"loadingStyles\":\"$undefined\",\"loadingScripts\":\"$undefined\",\"hasLoading\":false,\"error\":\"$f\",\"errorStyles\":[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/b4360cf725cbfd2e.css\",\"precedence\":\"next\",\"crossOrigin\":\"\"}]],\"errorScripts\":[],\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[\"$\",\"$L10\",null,{}],\"notFoundStyles\":[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/b4360cf725cbfd2e.css\",\"precedence\":\"next\",\"crossOrigin\":\"\"}]],\"styles\":null}]}],[\"$\",\"$L11\",null,{}],[\"$\",\"$L12\",null,{\"src\":\"/typekit.js\"}]]}]}],null]],\"initialHead\":[false,\"$L13\"],\"globalErrorComponent\":\"$14\",\"missingSlots\":\"$W15\"}]]\n"])</script><script>self.__next_f.push([1,"16:I[40440,[\"622\",\"static/chunks/622-984d2f01e710595b.js\",\"7179\",\"static/chunks/7179-f7ada6a0a351521c.js\",\"2273\",\"static/chunks/2273-75ba3fa4b4842e09.js\",\"7968\",\"static/chunks/7968-0fe233a1ea369ec3.js\",\"5201\",\"static/chunks/app/page/%5Bslug%5D/page-c92a664e09509adf.js\"],\"\"]\n17:T5fd,"])</script><script>self.__next_f.push([1,"One of the biggest challenges of designing for a global audience is to create interfaces that can efficiently adapt to different languages that have different writing and reading systems, different grammar rules, different typographic convention, and translating content leads to textual content that can differ drastically in length.  \n\nWhen translating content to different languages, the length of the translated text is likely going to be very different — sometimes up to 300% longer than the original one. Text expansion is one of the main challenges of designing effective global user interfaces.  \n \nIBM Globalization Guidelines reported an interesting correlation between the number of characters in a text field and the amount of text expansion. These experimental values clearly indicate that shorter text fields are more susceptible to text expansion, and these values can help us predict the effect on our user interfaces. To read further, [visit W3's Internationalization article](https://www.w3.org/International/articles/article-text-size.en).\n\n\n| Characters     | Max. estimated expansion     | Likely mapping to:     |\n| ---------- | ---------- | ---------- |\n| Up to 10       | 300%       | Buttons, pickers, tabs       |\n| 11 to 20       | 200%       | Labels, input fields       |\n| 21 to 30       | 180%       | Large headers       |\n| 31 to 50       | 160%       | Small headers, tooltips       |\n| 51 to 70       | 140%       | Short paragraphs       |\n| 70+       | 130%       | Longer paragraphs       |\n\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L16\",null,{\"data\":{\"id\":\"378a62e8-b3e8-4fbd-9809-3cac7c09f5e0\",\"title\":\"International design\",\"slug\":\"international-design\",\"site\":\"internal and public\",\"release_status\":\"released\",\"search_category\":\"foundation\",\"search_tags\":[\"localization\",\"internationalization\",\"globalization\",\"translation\",\"cultural-context\"],\"show_issues\":false,\"description\":\"The aim of international design is to create experiences that are equally usable, relevant, and meaningful across the globe to amplify the voices of global users.\",\"hero_image_style\":\"illustration\",\"table_of_contents\":true,\"component\":false,\"all_interactive_states\":\"not-applicable\",\"all_color_themes\":\"not-applicable\",\"all_platform_scales\":\"not-applicable\",\"defined_behaviors\":\"not-applicable\",\"usage_guidelines\":\"not-applicable\",\"internationalization_guidelines\":\"not-applicable\",\"keyboard_interactions\":\"not-applicable\",\"design_tokens\":\"not-applicable\",\"generated_ui_kit\":\"not-applicable\",\"isdeprecated\":false,\"defined_options\":\"not-applicable\",\"accessible_contrast_text\":\"not-applicable\",\"accessible_contrast_ui_components\":\"not-applicable\",\"accessible_use_color\":\"not-applicable\",\"ui_kit\":\"not-applicable\",\"writing_guidelines\":\"not-applicable\",\"content_design\":\"not-applicable\",\"xd_plugin\":\"not-applicable\",\"spectrum_design\":\"yes\",\"spectrum_dna\":\"no\",\"spectrum_css\":\"no\",\"react_spectrum_v2\":\"no\",\"react_spectrum_v3\":\"no\",\"spectrum_web_components\":\"no\",\"spectrum_windows\":\"no\",\"spectrum_macos\":\"no\",\"spectrum_ios\":\"no\",\"spectrum_android\":\"no\",\"drover_v7\":\"no\",\"spectrum_uxp\":\"no\",\"patterns_figma_url\":null,\"patterns_generic_link_text\":null,\"patterns_generic_link_url\":null,\"hero_image_desktop\":{\"width\":3905,\"id\":\"2d0ddf1a-43d3-4700-a655-86f74c12b11d\",\"filename_download\":\"international-design_hero_desktop@2x_5PNRgZmkcdzWNCXa1jQzyO.png\",\"height\":1281,\"description\":\"[blank]\",\"modified_on\":\"2021-01-26T04:25:52.470Z\",\"folder\":{\"id\":\"6b2e686c-0b66-4b5c-965a-317fbd9e272b\",\"name\":\"images\"}},\"hero_image_mobile\":{\"width\":1281,\"id\":\"e05942e7-ab39-4caf-b6e4-4f9bb55e86a7\",\"filename_download\":\"international-design_hero_mobile@2x_6fqno5ySb4WwQfcptiDVV4.png\",\"height\":1346,\"description\":\"[blank]\",\"modified_on\":\"2021-01-26T04:25:54.736Z\",\"folder\":{\"id\":\"6b2e686c-0b66-4b5c-965a-317fbd9e272b\",\"name\":\"images\"}},\"header_components\":[],\"sections\":[{\"id\":22055,\"sort\":1,\"section\":{\"id\":\"4880075a-d7c2-4dd2-b62a-0f8ed5ab2ea9\",\"title\":\"Introduction\",\"text\":\"There are roughly 200 countries and 6500 spoken languages in the world. Culture is deeply rooted in our thinking patterns, and it affects how users interact with and benefit from digital experiences. International design is a complex challenge that goes beyond translation. Acknowledging cultural characteristics and differences is the first step to create richer, world-ready digital experiences.  \\n\\nHere, you'll find recommendations and guardrails for how to start creating user experiences that are scalable globally, and concepts to better understand how varied our user landscape is. Designing for a global audience is not an exact science, but by acknowledging the following issues, we take an important first step to develop more empathy towards our international users and build globally relevant user interfaces.  \",\"visibility\":\"public\",\"display_title\":true,\"content\":[]}},{\"id\":22057,\"sort\":3,\"section\":{\"id\":\"e145a8df-b3bf-4449-aaa9-02a745a1a05e\",\"title\":\"Localization and text expansion\",\"text\":\"$17\",\"visibility\":\"public\",\"display_title\":true,\"content\":[{\"id\":41482,\"sort\":0,\"collection\":\"visual\",\"item\":{\"id\":\"9f333fa4-5e96-44da-990e-50d3ad076dd5\",\"title\":\"Text expansion example: button\",\"show_title_on_website\":false,\"image_style\":\"standard\",\"background_color\":null,\"caption\":null,\"desktop_image\":{\"width\":1952,\"id\":\"4939ced2-f9e1-4ece-be9b-eaeed9203713\",\"filename_download\":\"international-design_text-expansion_components_desktop@2x_MtiUuIft5xWH6qFnGwgeX.png\",\"height\":934,\"description\":\"Image illustrating the content from the table, using a button and a tooltip as examples. Buttons have a max estimated horizontal expansion of 300% from 4 characters in English, like \\\"View\\\", and tooltips have a max estimated horizontal expansion of 200% from 9 characters in English, like \\\"Copy link\\\". \",\"modified_on\":\"2021-01-26T04:26:01.897Z\",\"folder\":{\"id\":\"6b2e686c-0b66-4b5c-965a-317fbd9e272b\",\"name\":\"images\"}},\"mobile_image\":{\"width\":688,\"id\":\"4b2d4121-8e80-48f7-8ef4-2ff0e7768d1d\",\"filename_download\":\"international-design_text-expansion_components_mobile@2x_6roO7X3ChMcIlxYG9PYK84.png\",\"height\":1492,\"description\":\"Image illustrating the content from the table, using a button and a tooltip as examples. Buttons have a max estimated horizontal expansion of 300% from 4 characters in English, like \\\"View\\\", and tooltips have a max estimated horizontal expansion of 200% from 9 characters in English, like \\\"Copy link\\\". \",\"modified_on\":\"2021-01-26T04:26:02.953Z\",\"folder\":{\"id\":\"6b2e686c-0b66-4b5c-965a-317fbd9e272b\",\"name\":\"images\"}}}},{\"id\":41483,\"sort\":1,\"collection\":\"visual\",\"item\":{\"id\":\"b6b3ef24-6b6b-4de4-b95e-f24cbd093712\",\"title\":\"Text expansion: title\",\"show_title_on_website\":false,\"image_style\":\"standard\",\"background_color\":null,\"caption\":null,\"desktop_image\":{\"width\":1952,\"id\":\"6a095ef3-04fd-4317-a919-695165f4e262\",\"filename_download\":\"international-design_text-expansion_title_desktop@2x_AnPz908OR9HfuVDVMmmMv.png\",\"height\":908,\"description\":\"Image illustrating the content from the table, using a page title as an example. Page titles have a max estimated horizontal expansion of 300% from 36 characters in English, like \\\"Build your photography skills, fast.\\\"\",\"modified_on\":\"2021-01-26T04:25:59.431Z\",\"folder\":{\"id\":\"6b2e686c-0b66-4b5c-965a-317fbd9e272b\",\"name\":\"images\"}},\"mobile_image\":{\"width\":688,\"id\":\"64cea76a-1a88-484d-ae59-3094798b7e49\",\"filename_download\":\"international-design_text-expansion_title_mobile@2x_6ckLNtRh6NkwlYpsLAKFWd.png\",\"height\":968,\"description\":\"Image illustrating the content from the table, using a page title as an example. Page titles have a max estimated horizontal expansion of 300% from 36 characters in English, like \\\"Build your photography skills, fast.\\\"\",\"modified_on\":\"2021-01-26T04:26:05.092Z\",\"folder\":{\"id\":\"6b2e686c-0b66-4b5c-965a-317fbd9e272b\",\"name\":\"images\"}}}},{\"id\":41484,\"sort\":2,\"collection\":\"single_text\",\"item\":{\"id\":\"36b9cb60-78a1-494f-b01b-6333eec9e060\",\"text\":\"Localized content and text expansion have a substantial impact on how user interfaces look and perform across different countries. It’s vital to create layouts that can efficiently flow with the textual content of different length and nature. Checking the readiness of a design solution across multiple languages can be time-consuming, so tools like __World Ready__ (XD Plugin) can help you automate some of the process.\",\"title\":\"Localization-ready design\"}}]}},{\"id\":22058,\"sort\":4,\"section\":{\"id\":\"d9928189-3deb-4b44-8068-4445425921d3\",\"title\":\"Iconography and metaphors\",\"text\":\"There are a few things to keep in mind in terms of how visual metaphors are being perceived differently country by country. To learn more, visit the [Iconography page](/page/iconography).\",\"visibility\":\"all\",\"display_title\":true,\"content\":[{\"id\":41485,\"sort\":0,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"08aba0ca-3090-4a67-8d90-96995786834c\",\"title\":\"Correct or incorrect\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Checkmarks and “X” glyphs are commonly used in Western cultures to represent affirmation. However, in some countries such as Japan, these symbols are mostly used to indicate that something is not correct. At the same time, in Japan the “O” mark is the common way to express positive feedback to an action instead.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"32f1d965-509c-4409-9edb-ff1049595837\",\"filename_download\":\"international-design_iconography_correct@2x.png\",\"height\":400,\"description\":\"Illustration of 3 icons in a row: an X, a checkmark, and a circle.\",\"modified_on\":\"2022-04-10T20:32:57.892Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":41486,\"sort\":1,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"3a256a81-2351-4f9f-a8ba-3e19eee83095\",\"title\":\"Artifacts\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"We often use icons to represent real life objects that are familiar to the human eye and use everyday. However, some of these objects take different shapes in different countries. A common example is the mailbox icon; familiar to North American users, it doesn’t translate well for users in other countries.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"71df969f-8dbd-4f57-9f87-bcdcc5e20d88\",\"filename_download\":\"international-design_iconography_artifacts@2x.png\",\"height\":400,\"description\":\"Illustration comparing two mailbox icon designs: one style of mailbox that is common in North America, and one style of mailbox that is common in Japan.\",\"modified_on\":\"2022-04-10T20:32:57.961Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":41487,\"sort\":2,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"194fa531-321b-4c1c-8a75-254ab5712a1f\",\"title\":\"Hands and animals\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Hands gestures are, generally speaking, tricky to use. Even gestures that we frequently use such as thumbs up and thumbs down can be perceived in an offensive way in certain countries.\\n\\nAnimals can lead to misunderstandings as well. An example is the owl, which is a symbol of wisdom in the United States, carries the opposite meaning in some Asian countries.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"6a05584b-324c-4f46-8acf-ec0a9ddc8ad6\",\"filename_download\":\"international-design_iconography_hands-animals@2x.png\",\"height\":400,\"description\":\"Two illustrations of owls, side by side in a comparison. One owl is wearing a North American style graduation or scholar's cap and meant to be shown as wise. The other owl is not wearing anything but has a thought bubble over its head, with a question mark in the bubble, meant to show that it is confused or doesn't know anything.\",\"modified_on\":\"2022-04-10T20:32:58.014Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":41488,\"sort\":3,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"59a6a05e-0419-48fe-9d48-774f2c9398fa\",\"title\":\"Embedded text\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"As a rule of thumb, embedding text within icons, illustrations, and images can potentially lead to headaches when the content needs to be localized, as the content is not easy to translate and as the icons are not meant to adapt to text expansion. As a workaround, it’s reasonable to use lines instead of real text.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"8e92eb33-e8d7-41b0-ac00-0fb7117d0365\",\"filename_download\":\"international-design_iconography_embedded-text@2x.png\",\"height\":400,\"description\":\"5 different icons of speech bubbles, all including a different representation of a language. Examples include characters in Japanese, Hindi, English, Simplified Chinese, and 4 lines representing a block of text.\",\"modified_on\":\"2022-04-10T20:32:58.069Z\",\"folder\":null},\"mobile_image\":null}}]}},{\"id\":22059,\"sort\":5,\"section\":{\"id\":\"62b76088-4d4c-49a5-bf29-7940e14c1791\",\"title\":\"Imagery\",\"text\":\"As imagery is closely related to society, culture, beliefs, religion, and political values, it’s extremely important to be careful and intentional about picking pictures for each region or even country.\",\"visibility\":\"all\",\"display_title\":true,\"content\":[{\"id\":41489,\"sort\":0,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"662d8819-aa88-45e5-8f65-9a4d3f9b729d\",\"title\":\"People and portraits\",\"type\":\"other\",\"image_style\":\"illustration\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"It’s important to pick models who are dressed appropriately for the region. Editing of portraits also differs with facial manipulation and skin smoothing being popular in many Asian countries such as China and Korea. The amount of skin shown can also be considered too suggestive in some cultures.\\n\\nSimilarly, political, inspirational figures that are celebrated and extremely popular in the United States are likely to be unknown in some regions.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1152,\"id\":\"784cf481-f902-4f06-9b17-ea52cef25a31\",\"filename_download\":\"international-design_photography_people@2x_3AA0peUAov4K32tb8uSNnP.png\",\"height\":704,\"description\":\"Semi-abstract illustration of ethnically diverse men and women wearing modest clothing. \",\"modified_on\":\"2021-01-26T04:26:11.296Z\",\"folder\":{\"id\":\"6b2e686c-0b66-4b5c-965a-317fbd9e272b\",\"name\":\"images\"}},\"mobile_image\":null}},{\"id\":41490,\"sort\":1,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"2862ed1a-ed8c-4ae5-b8c1-aa78719ec74d\",\"title\":\"Religion and politics\",\"type\":\"other\",\"image_style\":\"illustration\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"In general, it’s best practice to avoid religious symbolism, hand gestures, and political imagery, as regions may perceive them differently.\",\"caption\":\"Photos of Tibetan monks are perceived in Western cultures as deeply spiritual. In China, on the other hand, Tibetan Buddhist monasteries are a symbol of a long religious and political dispute.\",\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1152,\"id\":\"73a5778c-a69f-46a0-ad1d-13230766775d\",\"filename_download\":\"international-design_photography_religion-politics@2x_69PqnvZavzSFygdX44Bv82.png\",\"height\":704,\"description\":\"Tibetan monk wearing a red robe walking across a bridge covered with multicolor prayer flags.\",\"modified_on\":\"2021-01-26T04:26:17.334Z\",\"folder\":{\"id\":\"6b2e686c-0b66-4b5c-965a-317fbd9e272b\",\"name\":\"images\"}},\"mobile_image\":null}},{\"id\":41491,\"sort\":2,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"2babe636-0739-4e2c-94ef-5e80d35ae435\",\"title\":\"Seasonal content\",\"type\":\"other\",\"image_style\":\"illustration\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Seasonal content is greatly different country by country, and photography should reflect it accordingly. For example, there is a variety of celebrations, such as Thanksgiving, that are not meaningful in Asian countries, or interpreted in different ways.\",\"caption\":\"Valentine’s day in Japan is quite unique from a western standpoint. The common roles are reversed and it’s the women who present gifts to significant others, usually chocolate or sweets.\",\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1152,\"id\":\"42c78f02-8d82-4b55-b003-040782b20c55\",\"filename_download\":\"international-design_photography_seasonal@2x_7wsKpcKV0zKJXpVNOSy9pE.png\",\"height\":704,\"description\":\"Two images of people holding gifts of red roses and a small box of chocolates with a pink bow.\",\"modified_on\":\"2021-01-26T04:26:22.176Z\",\"folder\":{\"id\":\"6b2e686c-0b66-4b5c-965a-317fbd9e272b\",\"name\":\"images\"}},\"mobile_image\":null}},{\"id\":41492,\"sort\":3,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"fc390a1e-84c6-49b9-90ce-30d0f4050efc\",\"title\":\"Traditions and manners\",\"type\":\"other\",\"image_style\":\"illustration\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"It’s often said that the best way to experience a country is to learn and \\nrespect its customs. Similarly, when choosing imagery across different cultures, we need to be respectful and aware of different traditions and manners across different regions, and act accordingly.\",\"caption\":\"Pictures like this one would likely represent “relaxation” in the United States, but are inappropriate in countries like Thailand, where you are not supposed to show the soles of your feet.\",\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1152,\"id\":\"61671a9f-3789-4f6e-ae4d-7f234476ebc5\",\"filename_download\":\"international-design_photography_traditions-manners@2x_5e3tNgfLYb3cAC3bqiVJ2A.png\",\"height\":704,\"description\":\"Person laying on their back on a bench in the sun with their feet in the air showing the soles of their feet.\",\"modified_on\":\"2021-01-26T04:26:25.884Z\",\"folder\":{\"id\":\"6b2e686c-0b66-4b5c-965a-317fbd9e272b\",\"name\":\"images\"}},\"mobile_image\":null}}]}},{\"id\":22060,\"sort\":6,\"section\":{\"id\":\"44ea0b4a-41bb-4b50-aa9b-2209d2d79367\",\"title\":\"Colors\",\"text\":\"As mentioned in the [Inclusive Design page](/page/inclusive-design), it’s important to not refer to objects by color, as users across countries perceive colors in different ways. Similarly, colors are perceived differently around the globe and carry different emotional, political, and cultural meanings.\",\"visibility\":\"all\",\"display_title\":true,\"content\":[{\"id\":41493,\"sort\":0,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"4805fe1d-e815-4c7d-97a4-2414c38f5976\",\"title\":\"The meaning of color is rooted in culture\",\"type\":\"other\",\"image_style\":\"illustration\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Let’s consider an example: the design for a finance application. To display how certain stock options are performing, designers from the United States or Europe would likely use the color green to depict good performance and red to display stocks performing poorly. On the other hand, surprisingly, designers in China or Japan would likely take an opposite approach, and reverse the usage of these two colors.\\n\\nWhile in the United States and most western countries the color red is often associated with the idea of error or danger. However, in eastern countries the color is tied to the concept of good luck and happiness.\\n\\nWhite is a color tied to the concept of purity in western countries, but can be seen as a mourning color in countries like China.  In Japan, purple is a color that expresses luxury and financial success, while in Italian popular culture is seen as a color that attracts bad luck. The list goes on. \\n\\n\\n\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1152,\"id\":\"e2612178-bf9a-4063-876f-747524c5b3ba\",\"filename_download\":\"international-design_colors_meaning@2x_42HvtjXzDYdK6RWvdDVozp.png\",\"height\":1192,\"description\":\"Images showing how color has different semantic meaning in different countries. Top image of stock exchange monitor using green for negative values, and red for positive values. Bottom image showing a color swatch of red, labeled with the United States' sentiment of passion, excitement, danger, loss, and error, and China's sentiment of happiness, good fortune, and prosperity. \",\"modified_on\":\"2021-01-26T04:26:29.662Z\",\"folder\":{\"id\":\"6b2e686c-0b66-4b5c-965a-317fbd9e272b\",\"name\":\"images\"}},\"mobile_image\":null}},{\"id\":41494,\"sort\":1,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"fa10d7e3-b09c-4ce9-951c-b70f9ea41bc9\",\"title\":\"Best practices\",\"type\":\"other\",\"image_style\":\"illustration\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"In general, no color can be assumed to have a consistent meaning across cultures.  \\n\\nWhen approaching the design of user interfaces for a global audience, colors should not be the only indicator of a specific status or use case. It's always better to integrate with textual or other visual clues. \\n\\nWhen designing promotional content, capturing the right tone and emotions from the local audience is key, and colors can have a big impact. It’s important to research specific markets from a cultural standpoint to choose the right creative decision.\",\"caption\":\"Color meanings across cultures, from Information is Beautiful.\",\"show_titles_on_website\":true,\"desktop_image\":{\"width\":2552,\"id\":\"4fdf3831-5bf9-4b7c-8e00-9786ee4d991f\",\"filename_download\":\"internatinoal-design_color_ColoursInCulture_6sSrVKijrQFAlfUmsNMypI.png\",\"height\":1773,\"description\":\"Radial diagram showing colors and their meaning across different cultures.\",\"modified_on\":\"2021-01-26T04:26:31.615Z\",\"folder\":{\"id\":\"6b2e686c-0b66-4b5c-965a-317fbd9e272b\",\"name\":\"images\"}},\"mobile_image\":null}}]}},{\"id\":22061,\"sort\":7,\"section\":{\"id\":\"91bba6d0-c196-42b1-ab98-2ea3e8dbeb22\",\"title\":\"Typography\",\"text\":\"Adobe Clean is our standard system typeface. Developed specifically for Adobe's brand identity and user interface design, it provides extensive language support. Please refer to the [Typography page](/page/typography) for an in-depth overview of our typography system.\",\"visibility\":\"all\",\"display_title\":true,\"content\":[{\"id\":41495,\"sort\":0,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"d40bbeaf-9977-49ff-8b91-04a8c76e898d\",\"title\":\"Readability across languages\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Languages like Chinese, Japanese, and Thai use characters that are visually complex compared to the Latin ones. \\n\\nThe peculiar nature of these writing systems has an impact on the character size, which is usually slightly bigger than western typography. \\n\\nTo ensure good readability, it’s important to adjust the line-height value of paragraphs to create some extra breathing room between lines, and when necessary, increase interline spacing between characters. Similarly to text expansion, these differences can have an impact on the width and height of localized paragraphs.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"b28275e4-ac2f-4fad-85fe-424f1c67b64a\",\"filename_download\":\"international-design_typography_readability@2x.png\",\"height\":400,\"description\":null,\"modified_on\":\"2022-04-08T19:38:25.428Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":41496,\"sort\":1,\"collection\":\"double_text\",\"item\":{\"id\":\"051f193a-2427-487d-88cb-1843b5933080\",\"show_headers_on_website\":true,\"text_one\":\"Different cultures have varying expectations around volume of content. Japanese users generally prefer larger amounts of content and greater detail compared to North Americans, so content-heavy interface designers should consider the volume of content expected by these users. We recommend a modular design that allows for additional content. This is both for usability and user satisfaction of our products.\",\"text_two\":null,\"title_one\":\"Content volume expectation\",\"title_two\":null}},{\"id\":41497,\"sort\":2,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"48d59d5a-0ec5-45da-8160-62579ca0d74f\",\"title\":\"Emphasis\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Using *bold* and *italics* to emphasize words or phrases is common in Western typography, but for certain languages it might not be the right way of highlighting content.\\n\\nFor example, languages like Chinese, Korean, and Japanese do not commonly rely on italicization because they lack oblique faces, and use alternatives like emphasis dots.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"d6a41c12-683f-431a-928f-9738c91b0169\",\"filename_download\":\"international-design_typography_emphasis@2x.png\",\"height\":400,\"description\":null,\"modified_on\":\"2022-04-08T19:38:58.491Z\",\"folder\":null},\"mobile_image\":null}}]}}],\"options\":[],\"versions\":[]}}]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"1\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"2\",{\"children\":\"International design - Spectrum\"}],[\"$\",\"meta\",\"3\",{\"name\":\"description\",\"content\":\"The aim of international design is to create experiences that are equally usable, relevant, and meaningful across the globe to amplify the voices of global users.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"International design - Spectrum\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"The aim of international design is to create experiences that are equally usable, relevant, and meaningful across the globe to amplify the voices of global users.\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://spectrum.adobe.com/page/international-design/\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale\",\"content\":\"en-US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image\",\"content\":\"https://spectrum.adobe.com/static/images1x/international-design_hero_mobile@2x_6fqno5ySb4WwQfcptiDVV4_1611635154736.png\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"1346\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:width\",\"content\":\"1281\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"International design - Spectrum\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"The aim of international design is to create experiences that are equally usable, relevant, and meaningful across the globe to amplify the voices of global users.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"https://spectrum.adobe.com/static/images1x/international-design_hero_mobile@2x_6fqno5ySb4WwQfcptiDVV4_1611635154736.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"shortcut icon\",\"href\":\"//www.adobe.com/favicon.ico\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script><script>self.__next_f.push([1,""])</script></body></html>
