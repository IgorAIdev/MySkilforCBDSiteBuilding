gory\":\"foundation\",\"search_tags\":[\"color\",\"gray\",\"background-layer\",\"elevation\",\"text-color\",\"icon-color\",\"illustration-color\",\"semantic-color\",\"static-color\",\"transparent\"],\"show_issues\":false,\"description\":\"Spectrum uses the relationships between colors and their properties to create a scalable foundation for color in the design system.\",\"hero_image_style\":\"standard\",\"table_of_contents\":true,\"component\":false,\"all_interactive_states\":\"not-applicable\",\"all_color_themes\":\"yes\",\"all_platform_scales\":\"not-applicable\",\"defined_behaviors\":\"not-applicable\",\"usage_guidelines\":\"yes\",\"internationalization_guidelines\":\"not-applicable\",\"keyboard_interactions\":\"not-applicable\",\"design_tokens\":\"yes\",\"generated_ui_kit\":\"not-applicable\",\"isdeprecated\":false,\"defined_options\":\"not-applicable\",\"accessible_contrast_text\":\"yes\",\"accessible_contrast_ui_components\":\"not-applicable\",\"accessible_use_color\":\"yes\",\"ui_kit\":\"yes\",\"writing_guidelines\":\"not-applicable\",\"content_design\":\"not-applicable\",\"xd_plugin\":\"not-applicable\",\"spectrum_design\":\"yes\",\"spectrum_dna\":\"no\",\"spectrum_css\":\"no\",\"react_spectrum_v2\":\"no\",\"react_spectrum_v3\":\"no\",\"spectrum_web_components\":\"no\",\"spectrum_windows\":\"no\",\"spectrum_macos\":\"no\",\"spectrum_ios\":\"no\",\"spectrum_android\":\"no\",\"drover_v7\":\"no\",\"spectrum_uxp\":\"no\",\"patterns_figma_url\":null,\"patterns_generic_link_text\":null,\"patterns_generic_link_url\":null,\"hero_image_desktop\":null,\"hero_image_mobile\":null,\"header_components\":[],\"sections\":[{\"id\":23631,\"sort\":0,\"section\":{\"id\":\"5ca1257c-11ab-4361-b094-8bb47b7620bf\",\"title\":\"Grays\",\"text\":\"Spectrum uses 11 [tints](/page/color-fundamentals/#Tint) and [shades](/page/color-fundamentals/#Shade) of gray per [color theme](/page/color-fundamentals/#Color-theme). These grays are neutral (fully [desaturated](/page/color-fundamentals/#Saturation)), which means that they can work alongside any color. Neutral grays help to prevent the misinterpretation of colors due to [chromatic adaptation](/page/color-fundamentals/#Chromatic-adaptation) or [simultaneous contrast](/page/color-fundamentals/#Simultaneous-contrast) within color or image manipulation workflows. \",\"visibility\":\"all\",\"display_title\":true,\"content\":[{\"id\":45220,\"sort\":1,\"collection\":\"visual\",\"item\":{\"id\":\"1a897a2b-a830-4621-8b6c-b4b35a71753c\",\"title\":\"Grays visual\",\"show_title_on_website\":false,\"image_style\":\"standard\",\"background_color\":null,\"caption\":null,\"desktop_image\":{\"width\":1856,\"id\":\"9d66d25b-371f-4a5c-9d32-9381850c536e\",\"filename_download\":\"color_colorSystem_grays@2x.png\",\"height\":384,\"description\":\"Row of gray squares progressively getting darker from right to left.\",\"modified_on\":\"2022-04-19T15:08:44.369Z\",\"folder\":null},\"mobile_image\":{\"width\":688,\"id\":\"1a638ec7-a4e6-48d5-aa5d-f6991de5afb0\",\"filename_download\":\"color_colorSystem_grays_mobile@2x.png\",\"height\":592,\"description\":\"Row of gray squares progressively getting darker from right to left.\",\"modified_on\":\"2022-04-19T15:08:44.345Z\",\"folder\":null}}},{\"id\":45153,\"sort\":2,\"collection\":\"single_text\",\"item\":{\"id\":\"5e0fb3d5-80e9-4c8f-8c07-da416ae9e295\",\"text\":\"Each color theme uses gray-100 as the default background color (except when using [background layers](/page/using-color/#Background-layers)). The color value for gray-100 is different per color theme. Spectrum generates all other gray [color values](/page/color-fundamentals/#Color-value) by [target contrast ratios](/page/color-fundamentals/#Target-contrast-ratio) with the background color value. Grays are designed to provide optimal contrast for text and icon content in the interface.\",\"title\":null}},{\"id\":45154,\"sort\":3,\"collection\":\"single_text_with_visual\",\"item\":{\"id\":\"5d6f89b4-9a63-47cc-aae9-e27b5aa71c4c\",\"title\":\"Gray backgrounds\",\"text\":\"Grays 50 through 200 are used for [background layers](/page/using-color/#Background-layers), which create depth and visual hierarchy in the framing of an application. When not using background layers, gray-100 is the default background color.\",\"image_style\":\"illustration\",\"image_position\":\"top\",\"background_color\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1856,\"id\":\"f671bf3a-c180-4588-9004-7e0bec5d4366\",\"filename_download\":\"color_colorSystem_gray-backgrounds@2x.png\",\"height\":524,\"description\":\"Diagram showing a row of Spectrum’s gray colors. Gray-50, gray-75, gray-100, and gray-200 are background layers. Gray-100 is the default background color. The five darkest grays have 3:1 contrast and above (with gray-100) and the four darkest grays have 4:5:1 contrast and above (with gray-100).\",\"modified_on\":\"2022-04-14T17:23:02.366Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45155,\"sort\":4,\"collection\":\"single_text_with_visual\",\"item\":{\"id\":\"44d2f932-2a56-435c-8592-8d67e408576f\",\"title\":\"Gray borders\",\"text\":\"Grays 200 and 300 are used for decorative borders and application framing. These grays are used for subtle contrast when applied decoratively or in non-essential elements.\\n\\nGray-400 is used for field borders (which includes components such as [text field](/page/text-field/) and [action button](/page/action-button/)).\\n\\nGray-600 is used for control borders (such as in a [switch](/page/switch/), [radio buttons](/page/radio-group/), and a [checkbox](/page/checkbox/)).\\n\\nWhen used on an interactive component, the progression of [color indices](/page/color-fundamentals/#Color-index) should conform to the guidelines on [colors for interactive states](/page/using-color/#Colors-for-interactive-states).\\n\",\"image_style\":\"illustration\",\"image_position\":\"top\",\"background_color\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1856,\"id\":\"32dd0911-8195-42d5-b7ee-491c5cd07714\",\"filename_download\":\"color_colorSystem_gray-borders@2x.png\",\"height\":524,\"description\":\"Row of Spectrum’s gray colors with annotations for decorative and app framing borders, field borders, and control borders. Control border is within 4.5:1 contrast with gray-100.\",\"modified_on\":\"2022-04-20T17:01:45.753Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45156,\"sort\":5,\"collection\":\"single_text_with_visual\",\"item\":{\"id\":\"9c09001d-8429-4fb5-abe1-590029d63722\",\"title\":\"Gray text\",\"text\":\"Grays 700 through 900 are for text content. These color values provide sufficient contrast against gray-100 in order to meet WCAG contrast minimums. Gray-500 is reserved for disabled text, which does not need to meet contrast minimums. Disabled text is lower in contrast from non-disabled text in order to clearly signify that it is unavailable for user interaction.\\n\\nWhen used for interactive text, the progression of [color indices](/page/color-fundamentals/#Color-index) should conform to the guidelines on [colors for interactive states](/page/using-color/#Colors-for-interactive-states).\",\"image_style\":\"illustration\",\"image_position\":\"top\",\"background_color\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1856,\"id\":\"a13f46cf-4630-4420-b2de-8596e0b4a27a\",\"filename_download\":\"color_colorSystem_gray-text@2x.png\",\"height\":524,\"description\":\"Row of Spectrum’s gray colors with annotation for disabled text (which is 3:1 contrast with gray-100), Label text, subdued text, text, and heading (all above 4.5:1 contrast with gray-100).\",\"modified_on\":\"2022-04-14T17:26:49.765Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45157,\"sort\":6,\"collection\":\"single_text_with_visual\",\"item\":{\"id\":\"af3bad0e-060a-4210-ae2f-080c07be524c\",\"title\":\"Gray icons and illustrations\",\"text\":\"Grays 600 through 900 are for icon content, and provide sufficient contrast against gray-100 (as well as gray-200) to meet contrast minimums. \\n\\nGray-500 is reserved for line illustrations. Gray-400 is reserved for disabled icons, which do not need to meet contrast minimums. Disabled icons are lower in contrast from non-disabled icons in order to clearly signify that they are unavailable for user interaction.\\n\\nWhen used for interactive icons, the progression of [color indices](/page/color-fundamentals/#Color-index) should conform to the guidelines on [colors for interactive states](/page/using-color/#Colors-for-interactive-states).\\n\",\"image_style\":\"illustration\",\"image_position\":\"top\",\"background_color\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1856,\"id\":\"5c7719b9-eaca-49b4-a525-83b4a89d0866\",\"filename_download\":\"color_colorSystem_gray-icons@2x.png\",\"height\":524,\"description\":\"Row of Spectrum’s grays with annotations for disabled icon, illustration (3:1 contrast with gray-100), subdued icon and icon (both above 4.5:1 contrast with gray-100).\",\"modified_on\":\"2022-04-14T17:27:33.090Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45158,\"sort\":7,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"65338372-4603-474a-afdd-13f3e94217da\",\"title\":\"Gray target contrast ratios\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Spectrum's grays follow a perceptually curved progression of [lightness](/page/color-fundamentals/#Lightness). The outcome is a progression of gray [color values](/page/color-fundamentals/#Color-value) that are optimal for Spectrum's [usage of gray](#Grays). Each lightness value was converted into a [target contrast ratio](/page/color-fundamentals/#Target-contrast-ratio), which follow a polynomial curve. \\n\\nGrays include [contrast ratios](/page/color-fundamentals/#Contrast-ratio) above and below a 1:1 contrast with the background. Contrasts below 1:1 produce grays that are lighter than gray-100 in light theme and darker than gray-100 in dark themes.\\n\\nDark themes target higher contrast ratios to provide appropriate and perceptually consistent contrast when compared to the light theme.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"76791d22-fba4-4344-b95e-967a17744760\",\"filename_download\":\"color_colorSystem_grays-swatch-progression@2x.png\",\"height\":1156,\"description\":\"Charts illustrating lightness progression and contrast ratio progressions for Spectrum grays. They illustrate curves within available contrast gamut. Actual maximum ratio differs per theme.\",\"modified_on\":\"2022-04-14T17:28:13.279Z\",\"folder\":null},\"mobile_image\":null}}]}},{\"id\":23632,\"sort\":1,\"section\":{\"id\":\"6a14aeb5-b319-4c28-ae0e-b97b7a1681eb\",\"title\":\"Colors\",\"text\":\"Spectrum uses 13 [colors](/page/color-fundamentals/#Color) per [color theme](/page/color-fundamentals/#Color-theme) with a set of 14 [tints](/page/color-fundamentals/#Tint) and [shades](/page/color-fundamentals/#Shade) per color. Colors are used sparingly and intentionally to reinforce hierarchies and to create clear modes of communication. Using too much color can be visually overwhelming and impacts user experience.\",\"visibility\":\"all\",\"display_title\":true,\"content\":[{\"id\":45159,\"sort\":1,\"collection\":\"visual\",\"item\":{\"id\":\"447f7a49-b462-4aa1-b8e1-ff66e32de470\",\"title\":\"Colors visual\",\"show_title_on_website\":false,\"image_style\":\"standard\",\"background_color\":null,\"caption\":null,\"desktop_image\":{\"width\":1856,\"id\":\"01f4e57b-b563-4dd9-a48f-295dcfd597b8\",\"filename_download\":\"color_colorSystem_colors_desktop@2x.png\",\"height\":384,\"description\":\"Row of squares colored red, orange, yellow, chartreuse, celery, green, seafoam, cyan, blue, indigo, purple, fuchsia, and magenta.\",\"modified_on\":\"2022-04-14T17:29:43.590Z\",\"folder\":null},\"mobile_image\":{\"width\":688,\"id\":\"922de7b4-0679-4c91-bc20-f327a461f829\",\"filename_download\":\"color_colorSystem_colors_mobile@2x.png\",\"height\":532,\"description\":\"Row of squares colored red, orange, yellow, chartreuse, celery, green, seafoam, cyan, blue, indigo, purple, fuchsia, and magenta.\",\"modified_on\":\"2022-04-14T17:29:43.570Z\",\"folder\":null}}},{\"id\":45160,\"sort\":2,\"collection\":\"single_text\",\"item\":{\"id\":\"39301335-3d92-4495-b8c3-e8da9e18ba8b\",\"text\":\"Colors give users context within their workflow and create a hierarchy of actions within the UI. Items in a selected or keyboard focus state are given visual importance since they relate to a user’s immediate actions. \\n\\nColors can also be used to show relationships between content types (e.g., categorization, labels in data visualizations). The [categorical color palette](/page/color-for-data-visualization/#Categorical) for data visualization is a subset of these colors. It ensures the highest degree of identifiability of colors for various color vision deficiencies. \\n\\nFor more information on using colors, view [Communicating with color](/page/using-color/#Communicating-with-color).\",\"title\":\"\"}},{\"id\":45161,\"sort\":3,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"54d6424e-f4d4-44fc-a29b-6e96737997a4\",\"title\":\"Color semantics\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Spectrum assigns generic meanings to a subset of colors in order to set consistent expectations for users. These meanings are codified in design tokens and used throughout components.\\n\\nSemantics can be used in a variety of ways to communicate meaning. Spectrum's semantic meanings include **informative**, **accent**, **negative**, **notice**, and **positive**. Use semantic colors to clearly and predictably communicate with a component’s appearance. When using color with semantic meaning, you must also display text or an icon in order to ensure the meaning is not lost for users who are unable to see or differentiate colors.\\n\\nColors have different emotional, political, and cultural meanings around the world. Spectrum tokens are not localized, so be sure to follow [international design guidelines on color](/page/international-design/#Colors) when building a global application.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"8d495a30-73d1-4ed5-991c-dfe4c38a9744\",\"filename_download\":\"color_colorSystem_colors-semantics@2x.png\",\"height\":666,\"description\":\"Diagram illustrating through labels the semantic color meanings for red (negative), orange (notice), green (positive), and blue (informative and accent).\",\"modified_on\":\"2022-04-14T17:30:50.327Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45162,\"sort\":4,\"collection\":\"single_text_with_visual\",\"item\":{\"id\":\"8672f03e-b484-4020-83df-c4ab31221582\",\"title\":\"Color backgrounds\",\"text\":\"Static color 900 is used for most [solid color backgrounds](/page/using-color/#Solid-color-background-with-black-or-white) in components. These colors should be taken from the [static color palette](/page/color-system/#Static-color-palette) and used with white text and icons only. \\n\\nStatic colors 300 through 600 are reserved for specific [solid color backgrounds](/page/using-color/#Solid-color-background-with-black-or-white) in components (yellow, orange, cyan, and chartreuse). These colors should be taken from the [static color palette](/page/color-system/#Static-color-palette) and used with black text and icons only. \\n\\nWhen used on an interactive component, the progression of [color indices](/page/color-fundamentals/#Color-index) should conform to the guidelines on [colors for interactive states](/page/using-color/#Colors-for-interactive-states).\\n\",\"image_style\":\"illustration\",\"image_position\":\"top\",\"background_color\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1856,\"id\":\"4aeaf68b-c9a2-4e63-812a-1edb92e97c9b\",\"filename_download\":\"color_colorSystem_colors-backgrounds@2x.png\",\"height\":494,\"description\":\"Row of Spectrum’s blue colors with annotations for component backgrounds with static color, along with contrast against black and white (all above 4.5:1).\",\"modified_on\":\"2022-04-14T17:34:40.319Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45216,\"sort\":6,\"collection\":\"visual\",\"item\":{\"id\":\"8a2aeae7-2f02-4b35-88f3-34ab0cc27a34\",\"title\":\"Two tone backgrounds visual\",\"show_title_on_website\":false,\"image_style\":\"illustration\",\"background_color\":null,\"caption\":null,\"desktop_image\":{\"width\":1856,\"id\":\"752b102d-4fdb-4daa-9733-305443a80ace\",\"filename_download\":\"color_colorSystem_colors-backgrounds-twotone@2x.png\",\"height\":494,\"description\":\"Row of Spectrum’s blue colors with annotation for two-tone backgrounds.\",\"modified_on\":\"2022-04-14T17:39:40.650Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45217,\"sort\":7,\"collection\":\"single_text\",\"item\":{\"id\":\"ab2f4cc8-fa14-45be-bf7a-9a2d08ba8359\",\"text\":\"Theme-specific color 100 is used for [two-tone color pairs](/page/using-color/#Two-tone-color-pairing). These colors are low contrast and pair well with specific color tokens for text and icons. \\n\\nWhen used on an interactive component, the progression of [color indices](/page/color-fundamentals/#Color-index) should conform to the guidelines on [colors for interactive states](/page/using-color/#Colors-for-interactive-states).\",\"title\":null}},{\"id\":45164,\"sort\":8,\"collection\":\"single_text_with_visual\",\"item\":{\"id\":\"b5f1d145-e849-4bab-97ff-39fb3bca137e\",\"title\":\"Color borders\",\"text\":\"Colors 600 through 800 are used for [semantic](#Color-semantics) component border colors. Non-semantic border colors use color 800.\\n\\nWhen used on an interactive component, the progression of [color indices](/page/color-fundamentals/#Color-index) should conform to the guidelines on [colors for interactive states](/page/using-color/#Colors-for-interactive-states).\\n\",\"image_style\":\"illustration\",\"image_position\":\"top\",\"background_color\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1856,\"id\":\"725191b1-8c7c-485b-bd8e-b0d3c10b0d0c\",\"filename_download\":\"color_colorSystem_colors-borders@2x.png\",\"height\":494,\"description\":\"Row of Spectrum’s blue colors with annotation for semantic borders (700 and 800 index are 3:1 contrast).\",\"modified_on\":\"2022-04-14T17:40:28.222Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45165,\"sort\":9,\"collection\":\"single_text_with_visual\",\"item\":{\"id\":\"c28652cd-c97a-4770-b081-391fb6483af2\",\"title\":\"Color text\",\"text\":\"Color 900 is used for colored text content, but Spectrum only supports the use of colored text for the accent and negative semantics. \\n\\nWhen used for interactive text, the progression of [color indices](/page/color-fundamentals/#Color-index) should conform to the guidelines on [colors for interactive states](/page/using-color/#Colors-for-interactive-states).\",\"image_style\":\"illustration\",\"image_position\":\"top\",\"background_color\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1856,\"id\":\"98c72181-288c-490f-b94f-dc76c5564223\",\"filename_download\":\"color_colorSystem_colors-text@2x.png\",\"height\":494,\"description\":\"Row of Spectrum’s blue colors with annotation for text content (4.5:1 with gray-100).\",\"modified_on\":\"2022-04-14T17:41:36.239Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45166,\"sort\":10,\"collection\":\"single_text_with_visual\",\"item\":{\"id\":\"7ab44aab-d53f-4079-90e4-512b40abbe25\",\"title\":\"Color icons and illustrations\",\"text\":\"Colors 700 through 1100 are used for icon and illustration content. Specific [color indices](/page/color-fundamentals/#Color-index) can be chosen in order to maintain appropriate [hue](/page/color-fundamentals/#Hue) identifiability and visual weight for each color when used in icons or illustrations. For example, yellow-700 may be an optimal color token for an icon in light theme, but yellow-1100 is optimal in darkest theme.\\n\\nWhen used on an interactive component, the progression of [color indices](/page/color-fundamentals/#Color-index) should conform to the guidelines on [colors for interactive states](/page/using-color/#Colors-for-interactive-states).\",\"image_style\":\"illustration\",\"image_position\":\"top\",\"background_color\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1856,\"id\":\"c38a01a4-cc3f-4f90-bf1a-e1b4209a7fd8\",\"filename_download\":\"color_colorSystem_colors-icons-illustrations@2x.png\",\"height\":494,\"description\":\"Row of Spectrum’s blue colors with annotation for icons and illustrations (from 3:1 to 4.5:1 and higher contrast with gray-100).\",\"modified_on\":\"2022-04-14T17:42:05.563Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45167,\"sort\":11,\"collection\":\"single_text_with_visual\",\"item\":{\"id\":\"e860883a-2e93-4a01-a54e-9d1891b4e012\",\"title\":\"Decorative colors\",\"text\":\"Colors 400 through 600 can be used for nonessential UI decoration. These colors have lower contrast with gray-100 and should be used sparingly and with caution. They should never be used to communicate essential information to users.\",\"image_style\":\"illustration\",\"image_position\":\"top\",\"background_color\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1856,\"id\":\"598cdba0-8e18-4f08-97a0-2d30e5c6ff71\",\"filename_download\":\"color_colorSystem_colors-decorative@2x.png\",\"height\":494,\"description\":\"Row of Spectrum’s blue colors with annotation for decorative colors (all below 3:1 contrast with gray-100).\",\"modified_on\":\"2022-04-14T17:43:02.758Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45168,\"sort\":12,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"755ce7b2-8dda-4618-9574-53de8c96e973\",\"title\":\"Color target contrast ratios\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Spectrum’s colors follow a perceptually linear progression of [lightness](/page/color-fundamentals/#Lightness). This is accomplished by plotting the lightness values along a subtle curve in a [uniform color space](/page/color-fundamentals/#Uniform-color-space). The curve combats the effects of [Stevens' power law](/page/color-fundamentals/#Stevens-power-law).\\n\\nThe outcome is a balanced, evenly distributed set of [color values](/page/color-fundamentals/#Color-value). Each lightness value was converted into a [target contrast ratio](/page/color-fundamentals/#Target-contrast-ratio), which follow a polynomial curve.  \\n\\nThese color values are best for providing a flexible color system. [When colors are used for interactive states](/page/using-color/#Colors-for-interactive-states), they have an even change in lightness, regardless of which colors are used.\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"b0d45318-68ca-4006-819f-8d0b556a4d3d\",\"filename_download\":\"color_colorSystem_colors-swatch-progression@2x.png\",\"height\":1156,\"description\":\"Charts illustrating the lightness progression and contrast ratio progressions for Spectrum colors.\",\"modified_on\":\"2022-04-14T17:44:45.927Z\",\"folder\":null},\"mobile_image\":null}}]}},{\"id\":23633,\"sort\":2,\"section\":{\"id\":\"9de5eefe-1078-4be1-8de7-415b1a58774f\",\"title\":\"Transparent white and black\",\"text\":\"Spectrum offers a set of 8 [color values](/page/color-fundamentals/#Color-value) of white and black using transparency. These colors are a translation of the [grays](#Grays) in a format that can be used over colored backgrounds or images.\",\"visibility\":\"all\",\"display_title\":true,\"content\":[{\"id\":45169,\"sort\":1,\"collection\":\"visual\",\"item\":{\"id\":\"e9e7e28d-57b7-400e-9d68-ec003bb05692\",\"title\":\"transparent white and black visual\",\"show_title_on_website\":false,\"image_style\":\"standard\",\"background_color\":\"#007772\",\"caption\":null,\"desktop_image\":{\"width\":1856,\"id\":\"6875cad4-30d8-4e60-bc7f-1d386b751cbf\",\"filename_download\":\"color_colorSystem_transparent-black-white_desktop@2x.png\",\"height\":592,\"description\":\"Two rows of Spectrum’s transparent white and transparent black colors.\",\"modified_on\":\"2022-04-14T21:37:11.874Z\",\"folder\":null},\"mobile_image\":{\"width\":688,\"id\":\"2d01b01d-dbd6-44a9-9cc4-00f41f3beccb\",\"filename_download\":\"color_colorSystem_transparent-black-white_mobile@2x.png\",\"height\":864,\"description\":\"Two rows of Spectrum’s transparent white and transparent black colors.\",\"modified_on\":\"2022-04-14T21:37:11.851Z\",\"folder\":null}}},{\"id\":45170,\"sort\":2,\"collection\":\"single_text\",\"item\":{\"id\":\"77a08e1a-75e0-49eb-a980-185ba532f5c6\",\"text\":\"The transparent white and transparent black colors are only for use in components that support a transparent color option (such as an [action button](/page/action-button/#Static-color)). These should not be used for any other purpose. \\n\\nUse the transparent white colors when the background color or image has a [lightness](/page/color-fundamentals/#Lightness) value less than 50% (e.g., rgb(112, 112, 112)). \\n\\nUse the transparent black colors when the background color or image has a [lightness](/page/color-fundamentals/#Lightness) value greater than 50% (e.g., rgb(119, 119, 119)).\",\"title\":null}},{\"id\":45171,\"sort\":3,\"collection\":\"single_text_with_visual\",\"item\":{\"id\":\"878d4e55-dc5a-4137-9b4e-a4be86c8a6a1\",\"title\":\"Transparent white or black backgrounds\",\"text\":\"Transparent-white-200 or transparent-black-200 are used for component backgrounds. In some cases, a component will use a transparent background for the default state. \\n\\nTransparent-white-800 or transparent-black-800 are used for component backgrounds in a selected state.\\n\\nWhen used on an interactive component, the progression of [color indices](/page/color-fundamentals/#Color-index) should conform to the guidelines on [colors for interactive states](/page/using-color/#Colors-for-interactive-states).\",\"image_style\":\"illustration\",\"image_position\":\"top\",\"background_color\":\"#007772\",\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1856,\"id\":\"e98b8fff-4a2d-4eda-b745-7426e6e2ecb5\",\"filename_download\":\"color_colorSystem_transparent-black-white-backgrounds@2x.png\",\"height\":524,\"description\":\"Row of Spectrum’s transparent white and transparent black colors with annotation for component background, disabled background, and selected background (3:1 contrast).\",\"modified_on\":\"2022-04-14T17:48:41.291Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45173,\"sort\":4,\"collection\":\"single_text_with_visual\",\"item\":{\"id\":\"ac89c95b-2795-4309-8e50-6ecb01c31110\",\"title\":\"Transparent white or black borders\",\"text\":\"Transparent-white-400 and transparent-black-400 are used for field borders (which includes components such as the [text field](/page/text-field/) and [action button](/page/action-button/)). \\n\\nTransparent-white-200 and transparent-black-200 are used for disabled component borders.\\n\\nWhen used on an interactive component, the progression of [color indices](/page/color-fundamentals/#Color-index) should conform to the guidelines on [colors for interactive states](/page/using-color/#Colors-for-interactive-states).\",\"image_style\":\"illustration\",\"image_position\":\"top\",\"background_color\":\"#007772\",\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1856,\"id\":\"4f1a420b-20e4-4da1-bdb6-a493f0f7ac48\",\"filename_download\":\"color_colorSystem_transparent-black-white-borders@2x.png\",\"height\":524,\"description\":\"Row of Spectrum’s transparent white and transparent black colors with annotation for disabled border and field border (both below 3:1 contrast).\",\"modified_on\":\"2022-04-14T17:50:31.938Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45172,\"sort\":5,\"collection\":\"single_text_with_visual\",\"item\":{\"id\":\"2a56b47d-8952-4909-999f-52146fafcbce\",\"title\":\"Transparent white or black text and icons\",\"text\":\"Transparent-white-900 and transparent-black-900 are used for text and icon content to ensure sufficient contrast on variable background colors. Variable background colors are colors that are determined at the product implementation level, and are not controlled by the Spectrum color system.\\n\\nWhen used for interactive text or icons, text and icon colors do not change.\",\"image_style\":\"illustration\",\"image_position\":\"top\",\"background_color\":\"#007772\",\"show_titles_on_website\":true,\"desktop_image\":{\"width\":1856,\"id\":\"6be406ed-e479-4e62-b4c1-e21e6f2d2b3b\",\"filename_download\":\"color_colorSystem_transparent-black-white-text-icon@2x.png\",\"height\":524,\"description\":\"Row of Spectrum’s transparent white and transparent black colors with annotation for disabled text and icon (below 3:1 contrast), and text and icon (4.5:1 contrast or above).\",\"modified_on\":\"2022-04-14T17:49:56.290Z\",\"folder\":null},\"mobile_image\":null}},{\"id\":45174,\"sort\":6,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"8e9a0cca-972d-4f53-9336-b0df6346d1b2\",\"title\":\"Transparent white and black contrast ratios\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Spectrum’s transparent white and black approximate the color values of the gray system. Contrast is not consistent or predictable for colors with an alpha transparency. \\n\\nThe transparent white and black colors were evaluated against a mid-tone gray to ensure contrast minimums are met or exceeded, so long as the [appropriate colors are used](#Transparent-white-and-black).\",\"caption\":null,\"show_titles_on_website\":true,\"desktop_image\":{\"width\":688,\"id\":\"adcb8641-dbf4-4a1d-abe2-923e1790cdd1\",\"filename_download\":\"color_colorSystem_transparent-black-white-contrast@2x.png\",\"height\":860,\"description\":\"Two columns demonstrating transparent white and transparent black version of an action button component on various background colors.\",\"modified_on\":\"2022-04-20T17:02:19.831Z\",\"folder\":null},\"mobile_image\":null}}]}},{\"id\":23634,\"sort\":3,\"section\":{\"id\":\"26697101-5c3e-4ee8-a371-c0d44190585b\",\"title\":\"Static color palette\",\"text\":null,\"visibility\":\"all\",\"display_title\":true,\"content\":[{\"id\":45175,\"sort\":0,\"collection\":\"text_beside_visual\",\"item\":{\"id\":\"1e250531-072e-41af-ac35-1b4c3f58d280\",\"title\":\"Static colors\",\"type\":\"other\",\"image_style\":\"standard\",\"background_color\":null,\"image_columns\":6,\"image_position\":\"right\",\"text\":\"Static colors have consistent color values across all themes and are not based on contrast with the background color of the theme. These are used when the identifiability of color's hue is a high priority, to ensure that a lighter color (such as yellow) remains a light value regardless of the theme. \\n\\nLighter static color backgrounds (100-800) use black text over the color. Darker static colors (900-1400) use white text over the color. This ensures that text will remain at least 4.5:1 or above in contrast with the color.\",\"caption\":null,\"show_titles_on_website\":false,\"desktop_image\":{\"width\":688,\"id\":\"884bbac0-e03a-44cf-9cc4-4f751b6a3a75\",\"filename_download\":\"color_colorSystem_static-colors@2x.png\",\"height\":568,\"description\":\"Static colors are identifiable across themes and have 4.5:1 or more contrast with black or white text. Example of two badges, one blue that says Licensed and one yellow that says Pending, in light theme and darkest theme.\",\"modified_on\":\"2022-04-14T21:40:21.110Z\",\"folder\":null},\"mobile_image\":null}}]}},{\"id\":23636,\"sort\":4,\"section\":{\"id\":\"e7493ee2-dbae-4f94-8552-3c3af557c5df\",\"title\":\"Resources\",\"text\":\"[Contrast and color accessibility (WebAIM)](https://webaim.org/articles/contrast/)\",\"visibility\":\"all\",\"display_title\":true,\"content\":[]}}],\"options\":[],\"versions\":[]}}]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"1\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"2\",{\"children\":\"Color system - Spectrum\"}],[\"$\",\"meta\",\"3\",{\"name\":\"description\",\"content\":\"Spectrum uses the relationships between colors and their properties to create a scalable foundation for color in the design system.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"Color system - Spectrum\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"Spectrum uses the relationships between colors and their properties to create a scalable foundation for color in the design system.\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://spectrum.adobe.com/page/color-system/\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale\",\"content\":\"en-US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image\",\"content\":\"https://spectrum.adobe.com/static/landscape.png\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Color system - Spectrum\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Spectrum uses the relationships between colors and their properties to create a scalable foundation for color in the design system.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"https://spectrum.adobe.com/static/landscape.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"shortcut icon\",\"href\":\"//www.adobe.com/favicon.ico\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script><script>self.__next_f.push([1,""])</script></body></html>
